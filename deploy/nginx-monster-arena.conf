# 몬스터 아레나 — nginx 리버스 프록시 (기존 nginx에 추가)
# 설치:
#   sudo cp deploy/nginx-monster-arena.conf /etc/nginx/conf.d/monster-arena.conf
#   (server_name을 본인 도메인으로 수정 → DNS A레코드를 EC2 IP로)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arena.example.com   ← 이게 443/TLS 블록을 자동 추가/관리
#
# 서브패스(/arena)가 아니라 서브도메인을 쓰는 이유:
#   웹앱 API가 /health, /players/... 같은 절대경로라 서브패스에선 깨짐.

server {
    listen 80;
    server_name arena.example.com;   # ← 본인 서브도메인으로 변경

    location / {
        proxy_pass http://127.0.0.1:3001;   # systemd PORT와 일치
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
